name: build

# Builds and tests libstl on Linux, macOS and Windows, then publishes the
# native static and shared library of each platform as a release asset.
#
# The point of running all three is that the library makes real platform
# assumptions: it swaps __attribute__ for __declspec, drops the pthread code
# path on Windows, and picks a different shared-library format (.so / .dylib /
# .dll) and linker flags on each target.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # Portability gate: the same sources under many language standards and
  # two compilers.  This is where a stray GNU extension gets caught.
  # ------------------------------------------------------------------
  standards:
    name: ${{ matrix.compiler }} / ${{ matrix.std }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [ gcc, clang ]
        std: [ c89, c99, c11, c17 ]
    steps:
      - uses: actions/checkout@v4

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
          fi

      - name: Build (strict, warnings as errors)
        run: |
          make clean
          make CSTD="-std=${{ matrix.std }}" \
               WARNINGS="-Wall -Wextra -Werror" \
               STL_NO_CONVENIENCE_MACROS=1 \
               all

      - name: Build with the convenience macro layer
        run: |
          make clean
          make CSTD="-std=${{ matrix.std }}" all

  # ------------------------------------------------------------------
  # Sanitizers and the optional feature switches.
  # ------------------------------------------------------------------
  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan+ubsan
            target: asan
          - name: cleanup-helpers
            target: test-cleanup
          - name: no-pthread
            target: test-nothreads
    steps:
      - uses: actions/checkout@v4

      - name: Install pthreads headers
        run: sudo apt-get update && sudo apt-get install -y libc6-dev

      - name: Run ${{ matrix.target }}
        run: make ${{ matrix.target }}

  # ------------------------------------------------------------------
  # Documentation.  Doxygen runs with WARN_AS_ERROR, so a dangling \ref, an
  # unclosed @defgroup or a malformed block fails the build rather than
  # quietly degrading the published reference.
  # ------------------------------------------------------------------
  docs:
    name: doxygen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Build the reference
        run: |
          # Older doxygen releases refuse to create OUTPUT_DIRECTORY, so it is
          # made explicitly rather than relying on the tool to do it.
          mkdir -p build
          doxygen Doxyfile
          test -f build/docs/html/index.html
          echo "generated $(find build/docs/html -name '*.html' | wc -l) pages"

  # ------------------------------------------------------------------
  # Native builds.  Each platform produces its own static and shared
  # library, named the way that platform expects.
  # ------------------------------------------------------------------
  native:
    name: native ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            artifact: linux-x86_64
          - os: ubuntu-24.04-arm
            label: linux-aarch64
            artifact: linux-aarch64
          - os: macos-14
            label: macos-arm64
            artifact: macos-arm64
          - os: windows-latest
            label: windows-x86_64
            artifact: windows-x86_64
    steps:
      - uses: actions/checkout@v4

      # ---------------- Linux / macOS (gcc or clang, POSIX shell) ----------
      - name: Build and test (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make all
          make test
          echo "--- artefacts ---"
          ls -l build/

      # upload-artifact does not preserve symlinks, so every artefact is copied
      # with -L (dereference) and the versioned symlinks are recreated when the
      # archive is unpacked by the consumer.  The versioned real file is what
      # carries the data; the unversioned name is a copy of it.
      # Each platform stages only the files that are unique to it.  The header
      # is the same source file everywhere, so it is not collected here: every
      # job producing a file called libstl.h is what made the release step
      # depend on which directory it happened to read last.
      - name: Collect artefacts (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          # Rename to the final asset name here, so the release job only has to
          # concatenate.  GitHub requires unique asset names within a release,
          # which is why the target is part of the name.
          case "${{ runner.os }}" in
            Linux)
              cp build/libstl.a                 "stage/libstl-${{ matrix.artifact }}.a"
              cp -L build/libstl.so.1.0.0       "stage/libstl-${{ matrix.artifact }}.so.1.0.0"
              cp -L build/libstl.so.1           "stage/libstl-${{ matrix.artifact }}.so.1"
              cp -L build/libstl.so             "stage/libstl-${{ matrix.artifact }}.so"
              ;;
            macOS)
              cp build/libstl.a                 "stage/libstl-${{ matrix.artifact }}.a"
              cp -L build/libstl.1.0.0.dylib    "stage/libstl-${{ matrix.artifact }}.dylib.1.0.0"
              cp -L build/libstl.1.dylib        "stage/libstl-${{ matrix.artifact }}.dylib.1"
              cp -L build/libstl.dylib          "stage/libstl-${{ matrix.artifact }}.dylib"
              ;;
          esac
          for f in stage/*; do
            [ -f "$f" ] || { echo "no artefacts were staged"; exit 1; }
          done
          ls -l stage/

      # ---------------- Windows (MSVC) ------------------------------------
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and test (MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          nmake /f Makefile.msvc clean
          nmake /f Makefile.msvc all
          if not exist build\libstl.lib exit /b 1
          if not exist build\libstl.dll exit /b 1
          nmake /f Makefile.msvc test

      - name: Collect artefacts (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          mkdir stage
          copy build\libstl.lib "stage\libstl-${{ matrix.artifact }}.lib"
          copy build\libstl.dll "stage\libstl-${{ matrix.artifact }}.dll"
          dir stage

      - name: Upload ${{ matrix.artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: stage/*
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Publish.  On a version tag every native build is attached as loose files,
  # already named for release by the job that produced it:
  #
  #   libstl.h                      the same source file on every platform
  #   libstl-linux-x86_64.a         link with this
  #   libstl-linux-x86_64.so        (soname inside still points at libstl.so.1)
  #   ...
  #
  # Every artifact holds a disjoint set of names, so they can be merged
  # directly; no renaming or per-directory bookkeeping is needed here.
  # ------------------------------------------------------------------
  release:
    name: publish release assets
    needs: [ standards, sanitizers, docs, native ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download every native build
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add the header
        run: |
          set -euo pipefail
          cp libstl.h dist/libstl.h
          ls -l dist/
          ( cd dist && sha256sum ./* > SHA256SUMS && cat SHA256SUMS )

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          fail_on_unmatched_files: true
